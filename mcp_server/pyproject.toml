[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dda-schema-mcp"
version = "0.1.0"
description = "MCP server exposing read-only lookup tools over the Blackboard DDA Postgres schema"
requires-python = ">=3.10"
dependencies = ["mcp[cli]>=1.29,<2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/dda_schema_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
