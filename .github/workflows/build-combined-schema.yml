name: Build Combined Blackboard Schema

on:
  push:
    paths:
      - 'docs/schema-*/schema/tables/**'
      - 'tools/build_combined_html.py'
      - '.github/workflows/build-combined-schema.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Combine all table HTML files
        run: python tools/build_combined_html.py

      - name: Commit combined file if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "schema-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/schema-*/schema/all_tables_combined.html
          if ! git diff --cached --quiet; then
            git commit -m "Update combined schema tables (auto)"
            git push
          else
            echo "No changes to commit."
          fi
